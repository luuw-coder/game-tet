<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <title>Game Tết</title>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <script>try{var t=localStorage.getItem('gt-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t}catch(e){}</script>
    <script>addEventListener('error',function(e){var r=document.getElementById('root');if(r&&!r.firstChild){r.textContent='Lỗi tải trang: '+(e.message||('không tải được '+(e.target&&(e.target.src||e.target.href))));r.style.cssText='padding:16px;font:14px monospace;color:#b00'}},true)</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
